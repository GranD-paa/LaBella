name: Build container image

# Builds on `preview`, not `main`. Vercel still deploys `main` to the live
# site, so merging there would push the half-finished ArvanCloud build to
# laparli.vercel.app. This trigger moves to `main` at cutover.
on:
  push:
    branches: [preview]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` is what the container pulls; the SHA tag makes it possible
          # to see which commit is actually running, and to roll back to one.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/laparli:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/laparli:${{ github.sha }}
          # Layer cache lives in the registry, so a rebuild that only changes
          # app code does not reinstall node_modules.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/laparli:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/laparli:buildcache,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '`${{ secrets.DOCKERHUB_USERNAME }}/laparli:latest`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
